<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JØXTV Overlay</title>

<style>
:root {
    --neon: #a855f7;
    --neon-soft: rgba(168, 85, 247, 0.4);
}

/* RESET OVERLAY */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

/* STAGE CENTRATO */
.stage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 520px;
    height: 300px;
}

/* FRAME */
.frame {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 18px;
    border: 2px solid var(--neon-soft);
    box-shadow:
        0 0 15px var(--neon),
        inset 0 0 15px var(--neon-soft);
    overflow: hidden;
}

/* GLOW */
.frame::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 18px;
    box-shadow:
        0 0 25px var(--neon),
        0 0 60px var(--neon);
    opacity: 0.6;
    animation: pulse 2s infinite alternate;
}

/* LINEE SCORREVOLI */
.scanlines {
    position: absolute;
    width: 200%;
    height: 100%;
    background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 40px,
        rgba(168,85,247,0.15) 42px
    );
    animation: moveLines 6s linear infinite;
}

/* ANGOLI */
.corner {
    position: absolute;
    width: 70px;
    height: 70px;
    border: 3px solid var(--neon);
    box-shadow: 0 0 15px var(--neon);
}

/* POSIZIONI ANGOLI */
.tl { top: -5px; left: -5px; border-right: none; border-bottom: none; }
.tr { top: -5px; right: -5px; border-left: none; border-bottom: none; }
.bl { bottom: -5px; left: -5px; border-right: none; border-top: none; }
.br { bottom: -5px; right: -5px; border-left: none; border-top: none; }

/* LINEE EXTRA */
.edge-line {
    position: absolute;
    background: var(--neon);
    box-shadow: 0 0 10px var(--neon);
}

.top-line {
    top: -2px;
    left: 20%;
    width: 60%;
    height: 2px;
    animation: widen 3s infinite;
}

.bottom-line {
    bottom: -2px;
    left: 25%;
    width: 50%;
    height: 2px;
    animation: widen 3s infinite reverse;
}

/* TESTI */
.brand {
    position: absolute;
    bottom: -35px;
    right: 0;
    font-family: Arial, sans-serif;
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--neon);
    text-shadow:
        0 0 10px var(--neon),
        0 0 20px var(--neon);
}

.label {
    position: absolute;
    top: -28px;
    left: 0;
    font-family: monospace;
    font-size: 12px;
    color: #aaa;
    letter-spacing: 2px;
}

/* DEBUG VISIVO (solo per browser) */
.debug {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-family: Arial;
    font-size: 14px;
}

/* ANIMAZIONI */
@keyframes pulse {
    from { opacity: 0.3; }
    to { opacity: 0.8; }
}

@keyframes moveLines {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
}

@keyframes widen {
    0% { width: 30%; left: 35%; }
    50% { width: 70%; left: 15%; }
    100% { width: 30%; left: 35%; }
}
</style>

</head>
<body>

<!-- DEBUG (serve solo per capire se carica su GitHub) -->
<div class="debug">Overlay caricato</div>

<div class="stage">

    <div class="label">LIVE CAM</div>

    <div class="frame">
        <div class="scanlines"></div>
    </div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="edge-line top-line"></div>
    <div class="edge-line bottom-line"></div>

    <div class="brand">JØXTV</div>

</div>

</body>
</html>
