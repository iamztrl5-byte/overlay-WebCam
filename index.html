<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JØXTV Webcam Frame</title>

<style>
:root {
    --frame-w: 420px;
    --frame-h: 240px;
    --neon: #a855f7;
}

/* RESET */
body {
    margin: 0;
    padding: 0;
    background: #111; /* VISIBILE SU GITHUB */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* TESTO DI DEBUG */
.test-text {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-size: 24px;
    font-family: Arial;
}

/* CONTAINER CENTRALE */
.stage {
    position: relative;
    width: var(--frame-w);
    height: var(--frame-h);
}

/* FRAME */
.frame {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    border: 3px solid var(--neon);
    box-shadow:
        0 0 10px var(--neon),
        0 0 20px var(--neon),
        inset 0 0 10px var(--neon);
    animation: pulse 2s infinite alternate;
}

/* ANIMAZIONE */
@keyframes pulse {
    from {
        box-shadow:
            0 0 5px var(--neon),
            0 0 10px var(--neon),
            inset 0 0 5px var(--neon);
    }
    to {
        box-shadow:
            0 0 15px var(--neon),
            0 0 30px var(--neon),
            inset 0 0 15px var(--neon);
    }
}
</style>

</head>
<body>

<div class="test-text">JØXTV WEBCAM FRAME</div>

<div class="stage">
    <div class="frame"></div>
</div>

</body>
</html>
